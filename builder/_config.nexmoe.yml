avatar: /favicon.png # 网站 Logo

background: # 既是博客的背景，又是文章默认头图
    path: /img/site-background.webp
    width: 3031
    height: 2006

favicon:
  href: /favicon.png # 网站图标
  type: image/png # 图标类型，可能的值有(image/png, image/vnd.microsoft.icon, image/x-icon, image/gif)

function: # 功能开关，可选值（true,false）
  globalToc: true # 开启该功能会自动开启文章 TOC（文章目录） 功能
  wordCount: false # 是否开启文章字数统计 (true, false)
  copyCode: true # 是否允许复制代码块
  darkmode: true # 允许暗黑模式(从3.0的说明里抄来的，不知道有没有效果)

imageCDN: # 图片 CDN 功能
  enable: false # 开启该功能

color: # 配色方案，从first到seventh为优先级为1-7的颜色，默认为彩虹配色(看起来4.0不支持此项功能)

# 自定义样式，启用后可在站点的source文件夹下新建custom.css自定义站点样式
customStyles:

menu:
    回到首页:
        - /
        - icon-home
    文章归档:
        - /archives.html
        - icon-container
    关于本站:
        - /about.html
        - icon-info-circle

widgets:
    - name: search
      enable: true
      options: 
        search: 
            type: local
    
    - name: category
      enable: true
    - name: tagcloud
      enable: true
      options: 
        maxTagcloud: 36  # 标签云组件显示的标签数量，0 表示不限制
    - name: hitokoto # 一言 widget
      enable: false
      options: 
        widgetHitokoto: # 一言组件
            loading_placeholder: '🚀 获取中...' # 正在一言时的占位符
            loading_error_placeholder: '🐞 获取失败...' # 加载一言失败时的占位符
            category: # 一言句子类型（可选），不配置的话随机获取，详见 https://developer.hitokoto.cn/sentence/#%E5%8F%A5%E5%AD%90%E7%B1%BB%E5%9E%8B-%E5%8F%82%E6%95%B0
    - name: social
      enable: true
      options: 
        social:
            GitHub:
                - https://github.com/Knighthana/
                - icon-github
                - rgb(25, 23, 23)
                - rgba(25, 23, 23, .1)
            RSS:
                - /atom.xml
                - icon-rss
                - rgb(235, 152, 0)
                - rgba(235, 152, 0, .15)
    - name: archive #settings: widgetAchive
      enable: true
      options:
        widgetAchive: #文章归档组件
            archive_type: 'year' #按月展示还是按年展示
            show_count: true  #是否展示数量
    - name: recent_posts
      enable: true
    - name: link #settings: widgetLink
      enable: true
      options: 
        widgetLink: #链接组件
            - title: This site
              img: https://knighthana.github.io/favicon.png
              link : https://knighthana.github.io #https://example.com/

copyTip: "著作权归作者所有。\n商业转载请联系作者获得授权，非商业转载请注明出处。\n来源：%url" # 自定义复制版权文案,使用 %url 代替当前页面URL, 修改为false禁用
