name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Restore mtime from git
        run: |
          git -c core.quotePath=false log --format='%cI' --name-only -- 'raw/*.md' \
            | awk '/^[0-9]{4}-[0-9]{2}-[0-9]{2}T/ {ts=$0; next} /^$/ {next}
                   {if (!seen[$0]++) print ts "\t" $0}' \
            | while IFS=$'\t' read -r ts f; do
                if [ -f "$f" ]; then
                  touch -d "$ts" "$f"
                fi
              done

      - name: Setup pandoc (cached)
        uses: actions/cache@v6
        with:
          path: /tmp/pandoc.deb
          key: pandoc-3.10.1
          restore-keys: pandoc-

      - name: Install pandoc
        run: |
          if [ ! -f /tmp/pandoc.deb ]; then
            curl -fsSL -o /tmp/pandoc.deb \
              https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          fi
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: builder/package-lock.json

      - name: Install dependencies
        working-directory: builder
        run: npm ci --registry=https://registry.npmjs.org

      - name: Validate front-matter tags
        working-directory: builder
        run: node check_tags.js

      - name: Generate site
        working-directory: builder
        run: npx hexo generate

      - name: Copy external pages
        run: cp -a external/. builder/public/external_ref_docs/

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: builder/public

      - name: Deploy
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
